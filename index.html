<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather | </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            transition: 1s ease;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 30px;
            width: 90%; max-width: 400px;
            padding: 25px; color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* التنقل بين الأقسام */
        .nav-bar {
            display: flex; justify-content: space-around;
            background: rgba(255,255,255,0.1);
            padding: 8px; border-radius: 15px; margin-bottom: 20px;
        }

        .nav-btn {
            background: none; border: none; color: white;
            font-size: 18px; cursor: pointer; opacity: 0.5; transition: 0.3s;
        }

        .nav-btn.active { opacity: 1; transform: scale(1.2); }

        /* التحكم في ظهور الأقسام */
        .content-section { display: none; animation: fadeIn 0.4s ease; }
        .content-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* تصميم البحث والطقس */
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        .search-box input {
            flex: 1; background: rgba(255,255,255,0.2); border: none;
            padding: 10px 15px; border-radius: 12px; color: white; outline: none;
        }
        .search-box button {
            width: 40px; height: 40px; border-radius: 12px; border: none;
            background: rgba(255,255,255,0.3); color: white; cursor: pointer;
        }

        .temp { font-size: 60px; font-weight: bold; margin: 10px 0; }
        .suggestion-box { background: rgba(255,255,255,0.15); padding: 10px; border-radius: 12px; margin: 15px 0; font-size: 14px; }
        
        .forecast-container {
            display: flex; justify-content: space-between;
            margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .forecast-item img { width: 35px; }

        .tip-item { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; margin-bottom: 10px; text-align: right; }
        .error { color: #ffbaba; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="nav-bar">
        <button onclick="changeTab('home', this)" class="nav-btn active"><i class="fas fa-cloud-sun"></i></button>
        <button onclick="changeTab('tips', this)" class="nav-btn"><i class="fas fa-lightbulb"></i></button>
        <button onclick="changeTab('about', this)" class="nav-btn"><i class="fas fa-info-circle"></i></button>
    </nav>
