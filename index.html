<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-card">
    <div class="search-area">
        <input type="text" id="city-input" placeholder="ابحث عن مدينة..." autocomplete="off">
        <button id="search-btn"><i class="fas fa-search"></i></button>
        <button id="geo-btn"><i class="fas fa-location-arrow"></i></button>
    </div>

    <p id="msg-box" class="message"></p>

    <div class="main-content">
        <div id="weather-tab" class="tab-content active">
            <div id="weather-info" style="display: none;">
                <h2 id="city-name"></h2>
                <h1 id="temp-display"></h1>
                <p id="weather-desc"></p>
                <div class="forecast" id="forecast-container"></div>
            </div>
            <p class="placeholder-msg">☁️ ابحث عن مدينتك لعرض حالة الجو</p>
        </div>

        <div id="prayer-tab" class="tab-content">
            <h3>مواقيت الصلاة</h3>
            <div id="prayer-times" class="prayer-grid">
                <p style="opacity:0.7; margin-top:20px;">بانتظار تحديد الموقع...</p>
            </div>
        </div>

        <div id="azkar-tab" class="tab-content">
            <h3>أذكار المسلم</h3>
            <div class="azkar-box">
                <p id="azkar-text">ألا بذكر الله تطمئن القلوب</p>
                <button onclick="nextZekr()" class="next-btn">الذكر التالي</button>
            </div>
        </div>

        <div id="about-tab" class="tab-content">
            <div class="dev-card">
                <i class="fas fa-user-shield dev-icon"></i>
                <p class="dev-label">تم التطوير بواسطة</p>
                <h2 class="dev-name">عبدالرحمن الشديفات J<span class="j-badge">J</span></h2>
                <p class="dev-bio">مطور واجهات برمجية ، أهتم بتقديم تجربة مستخدم فريدة وبسيطة.</p>
                <div class="dev-footer">إصدار 2026.1.0</div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="openTab(event, 'weather-tab')">
            <i class="fas fa-cloud-sun"></i>
            <span>الطقس</span>
        </button>
        <button class="nav-btn" onclick="openTab(event, 'prayer-tab')">
            <i class="fas fa-mosque"></i>
            <span>الصلاة</span>
        </button>
        <button class="nav-btn" onclick="openTab(event, 'azkar-tab')">
            <i class="fas fa-book-open"></i>
            <span>الأذكار</span>
        </button>
        <button class="nav-btn" onclick="openTab(event, 'about-tab')">
            <i class="fas fa-info-circle"></i>
            <span>المطور</span>
        </button>
    </nav>
</div>

<script src="script.js"></script>
</body>
</html>
