<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Pro Max | النسخة الكاملة</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            /* الخلفية المتحركة */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 1.5s ease;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 35px;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* نظام التنقل بين الصفحات */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.08);
            padding: 10px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .nav-link {
            background: none; border: none; color: white;
            font-size: 20px; cursor: pointer; opacity: 0.4; transition: 0.3s;
        }

        .nav-link.active { opacity: 1; transform: scale(1.2); color: #fff; }

        .page { display: none; animation: fadeIn 0.5s ease forwards; }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* أدوات البحث */
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box input {
            flex: 1; background: rgba(255,255,255,0.2); border: none;
            padding: 12px 20px; border-radius: 15px; color: white; outline: none;
        }
        .search-box button {
            width: 48px; height: 48px; border-radius: 15px; border: none;
            background: rgba(255,255,255,0.25); color: white; cursor: pointer; transition: 0.3s;
        }
        .search-box button:hover { background: #fff; color: #333; }

        /* بطاقة الطقس */
        .weather-card { display: none; }
        .temp { font-size: 70px; font-weight: 800; margin: 5px 0; }
        .desc { font-size: 1.2rem; opacity: 0.9; margin-bottom: 20px; }
        
        .suggestion-box {
            background: rgba(255,255,255,0.18); padding: 12px;
            border-radius: 15px; margin-bottom: 20px; font-size: 14px;
        }

        .details {
            display: flex; justify-content: space-around;
            padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* التوقعات */
        .forecast-container {
            display: flex; justify-content: space-between;
            margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .forecast-item { font-size: 12px; }
        .forecast-item img { width: 40px; }

        /* صفحة النصائح */
        .tips-list { text-align: right; }
        .tip-item { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; margin-bottom: 10px; }

        .error { color: #ffbaba; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="nav-bar">
        <button onclick="showPage('home', this)" class="nav-link active"><i class="fas fa-home"></i></button>
        <button onclick="showPage('tips', this)" class="nav-link"><i class="fas fa-lightbulb"></i></button>
        <button onclick="showPage('about', this)" class="nav-link"><i class="fas fa-info-circle"></i></button>
    </nav>

    <div id="home" class="page active">
        <div class="search-box">
            <input id="city" type="text" placeholder="ابحث عن مدينة...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
            <button id="location-btn"><i class="fas fa-location-arrow"></i></button>
        </div>
        <div class="error" id="error"></div>
        <div class="weather-card" id="card">
            <h2 id="cityName"></h2>
            <div id="date" style="opacity: 0.8; margin-bottom: 10px;"></div>
            <img id="weatherIcon" src="" alt="">
            <div class="temp" id="temp"></div>
            <div class="desc" id="desc"></div>
            <div id="suggestion" class="suggestion-box"></div>
            <div class="details">
                <div class="col"><i class="fas fa-droplet"></i> <span id="humidity"></span></div>
                <div class="col"><i class="fas fa-wind"></i> <span id="wind"></span></div>
            </div>
            <div class="forecast-container" id="forecast"></div>
        </div>
    </div>

    <div id="tips" class="page">
        <h3 style="margin-bottom: 20px;">نصائح ذكية</h3>
        <div class="tips-list">
            <div class="tip-item">🧥 الجو بارد؟ لا تنسَ معطفك المفضل.</div>
            <div class="tip-item">☀️ الشمس قوية اليوم، واقي الشمس خيار ذكي.</div>
            <div class="tip-item">💧 الرطوبة عالية، اشرب الكثير من الماء.</div>
            <div class="tip-item">🚲 الرياح هادئة، وقت مثالي لممارسة الرياضة!</div>
        </div>
    </div>

    <div id="about" class="page">
        <h3 style="margin-bottom: 15px;">حول التطبيق</h3>
        <p style="line-height: 1.6; opacity: 0.9;">Weather Pro Max هو تطبيق طقس متكامل يعتمد على بيانات دقيقة ويوفر تجربة بصرية ممتعة بفضل الخلفيات التفاعلية.</p>
        <div style="margin-top: 30px; font-size: 30px; display: flex; justify-content: center; gap: 20px;">
            <i class="fab fa-github"></i>
            <i class="fab fa-linkedin"></i>
        </div>
    </div>
</div>

<script>
    const API_KEY = "6b7edc82798b727dce5282c19e9298a6";
    
    // تدرجات الخلفية بناءً على الطقس
    const bgGradients = {
        Clear: "linear-gradient(-45deg, #f7b733, #fc4a1a, #f7b733, #fc4a1a)",
        Clouds: "linear-gradient(-45deg, #606c88, #3f4c6b, #606c88, #3f4c6b)",
        Rain: "linear-gradient(-45deg, #203a43, #2c5364, #0f2027, #2c5364)",
        Snow: "linear-gradient(-45deg, #83a4d4, #b6fbff, #83a4d4, #ffffff)",
        Default: "linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab)"
    };

    // وظيفة التنقل بين الصفحات
    function showPage(pageId, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        btn.classList.add('active');
    }

    // البحث
    document.getElementById("search-btn").addEventListener("click", () => getWeather(document.getElementById("city").value));
    document.getElementById("city").addEventListener("keypress", (e) => { if(e.key === "Enter") getWeather(e.target.value); });
    document.getElementById("location-btn").addEventListener("click", () => {
        navigator.geolocation.getCurrentPosition(p => getWeather(null, p.coords.latitude, p.coords.longitude));
    });

    async function getWeather(city, lat = null, lon = null) {
        const error = document.getElementById("error");
        let url = `https://api.openweathermap.org/data/2.5/weather?appid=${API_KEY}&units=metric&lang=ar`;
        url += city ? `&q=${encodeURIComponent(city)}` : `&lat=${lat}&lon=${lon}`;

        try {
            const res = await fetch(url);
            const data = await res.json();
            if (data.cod !== 200) throw new Error();

            // تحديث الواجهة
            document.getElementById("cityName").textContent = data.name;
            const temp = Math.round(data.main.temp);
            document.getElementById("temp").textContent = temp + "°";
            document.getElementById("desc").textContent = data.weather[0].description;
            document.getElementById("humidity").textContent = data.main.humidity + "%";
            document.getElementById("wind").textContent = data.wind.speed + " م/ث";
            document.getElementById("weatherIcon").src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png`;
            document.getElementById("date").textContent = new Date().toLocaleDateString('ar-EG', {weekday:'long', day:'numeric', month:'long'});

            // اقتراح الملابس
            const sug = document.getElementById("suggestion");
            if(temp < 15) sug.textContent = "🧥 الجو بارد، المعطف ضروري!";
            else if(temp < 25) sug.textContent = "👕 الجو لطيف، ملابس خفيفة تكفي.";
            else sug.textContent = "☀️ الجو حار، ارتدِ ملابس صيفية.";

            // الخلفية والتوقعات
            document.body.style.background = bgGradients[data.weather[0].main] || bgGradients.Default;
            getForecast(data.coord.lat, data.coord.lon);
            document.getElementById("card").style.display = "block";
            error.textContent = "";
        } catch {
            error.textContent = "لم نجد المدينة!";
        }
    }

    async function getForecast(lat, lon) {
        const res = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=ar`);
        const data = await res.json();
        const forecastDiv = document.getElementById("forecast");
        forecastDiv.innerHTML = "";
        for (let i = 0; i < data.list.length; i += 8) {
            const day = data.list[i];
            forecastDiv.innerHTML += `
                <div class="forecast-item">
                    <div>${new Date(day.dt_txt).toLocaleDateString('ar-EG', {weekday:'short'})}</div>
                    <img src="https://openweathermap.org/img/wn/${day.weather[0].icon}.png">
                    <div>${Math.round(day.main.temp)}°</div>
                </div>`;
        }
    }
</script>

</body>
</html>
