<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نَسيم | Naseem</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">

    <section id="weather" class="page active">
        <canvas id="weather-canvas" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;"></canvas>
        <div style="position:relative; z-index:1;">
            <div class="search-box">
                <input type="text" id="city-input" placeholder="اكتب اسم المدينة...">
                <button onclick="getWeather()"><i class="fas fa-search"></i></button>
            </div>
            <div id="weather-result">
                <h2 id="out-city">--</h2>
                <h1 id="out-temp">--°</h1>
                <p id="out-desc">ابحث لترى النتائج</p>
            </div>
            <div class="weather-details" id="out-details" style="display:none">
                <div class="detail-pill">
                    <span class="label">رطوبة</span>
                    <span class="val" id="out-humidity">--%</span>
                </div>
                <div class="detail-pill">
                    <span class="label">رياح</span>
                    <span class="val" id="out-wind">-- كم/س</span>
                </div>
                <div class="detail-pill">
                    <span class="label">يُحس</span>
                    <span class="val" id="out-feels">--°</span>
                </div>
            </div>
            <div id="forecast-section" style="display:none; margin-top:20px;">
                <p class="section-label">توقعات 5 أيام</p>
                <div id="out-forecast" class="forecast-container"></div>
            </div>
            <div id="suhail-card" class="suhail-card" style="display:none; margin-top:20px;">
                <span class="suhail-star">⭐</span>
                <div class="suhail-info">
                    <p class="suhail-title">نجم سهيل</p>
                    <p id="suhail-countdown-text" class="suhail-count"></p>
                    <p id="suhail-info" class="suhail-desc"></p>
                </div>
            </div>
        </div>
    </section>

    <section id="prayer" class="page">
        <h2 class="page-title">🕋 مواقيت الصلاة</h2>
        <div id="prayer-countdown" class="countdown-card" style="display:none">
            <p class="countdown-label">باقي على الصلاة القادمة</p>
            <div class="countdown-timer" id="countdown-timer">--:--:--</div>
            <p class="countdown-next" id="countdown-next"></p>
        </div>
        <div id="prayer-output" class="info-card"><p>يرجى البحث عن مدينة أولاً</p></div>
    </section>

    <section id="sky" class="page">
        <h2 class="page-title">🌌 السماء</h2>
        <div class="sky-canvas-container">
            <canvas id="sky-canvas"></canvas>
        </div>
        <div id="suhail-big-card" class="suhail-big-card info-card">
            <div class="suhail-big-header">
                <span class="suhail-big-star">⭐</span>
                <div>
                    <p class="suhail-big-title">نجم سهيل — Canopus</p>
                    <p class="suhail-big-sub">ثاني أضيأ نجم في السماء</p>
                </div>
            </div>
            <div class="suhail-big-countdown" id="suhail-big-countdown">-- يوم</div>
            <p class="suhail-big-date" id="suhail-big-date"></p>
            <hr class="divider">
