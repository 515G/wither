<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="web-app">
    <section id="page-weather" class="page active">
        <div class="search-box">
            <input type="text" id="city-input" placeholder="ابحث عن مدينة...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
        <div class="content">
            <div id="weather-info" style="display: none;">
                <h2 id="city-name"></h2>
                <h1 id="temp-display"></h1>
                <p id="weather-desc"></p>
            </div>
            <p id="start-msg">☁️ ابحث لتعرف حالة الطقس</p>
        </div>
    </section>

    <section id="page-prayer" class="page">
        <h3>🕋 مواقيت الصلاة</h3>
        <div id="prayer-list" class="list-container">
            <p>يرجى البحث عن مدينة أولاً</p>
        </div>
    </section>

    <section id="page-azkar" class="page">
        <h3>📿 أذكار المسلم</h3>
        <div class="azkar-box">
            <p id="azkar-text">ألا بذكر الله تطمئن القلوب</p>
            <button onclick="nextZekr()" class="btn-next">الذكر التالي</button>
        </div>
    </section>

    <section id="page-about" class="page">
        <div class="dev-card">
            <div class="avatar"></div>
            <h2> J عبدالرحمن الشديفات</h2>
            <p>مطور واجهات ويب</p>
            <hr>
            <p>تم تصميم هذا الموقع بواجهات منفصلة لتجربة مستخدم أفضل.</p>
        </div>
    </section>

    <nav class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('page-weather', this)">
            <i class="fas fa-cloud"></i>
            <span>الطقس</span>
        </button>
        <button class="tab-btn" onclick="switchTab('page-prayer', this)">
            <i class="fas fa-clock"></i>
            <span>الصلاة</span>
        </button>
        <button class="tab-btn" onclick="switchTab('page-azkar', this)">
            <i class="fas fa-book-open"></i>
            <span>الأذكار</span>
        </button>
        <button class="tab-btn" onclick="switchTab('page-about', this)">
            <i class="fas fa-user"></i>
            <span>عني</span>
        </button>
    </nav>
</div>

<script src="script.js"></script>
</body>
</html>
