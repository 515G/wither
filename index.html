<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="web-container">
    <section id="weather-tab" class="tab-view active">
        <div class="search-area">
            <input type="text" id="city-input" placeholder="ابحث عن مدينة...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
        <div class="content-body">
            <div id="weather-result" style="display: none;">
                <h2 id="city-name"></h2>
                <h1 id="temp-display"></h1>
                <p id="weather-desc"></p>
            </div>
            <p class="hint-text">☁️ ابحث لترى حالة الطقس</p>
        </div>
    </section>

    <section id="prayer-tab" class="tab-view">
        <h2 class="view-title">🕋 مواقيت الصلاة</h2>
        <div id="prayer-times" class="prayer-list">
            <p>يرجى البحث عن مدينة أولاً</p>
        </div>
    </section>

    <section id="azkar-tab" class="tab-view">
        <h2 class="view-title">📿 الأذكار</h2>
        <div class="azkar-card">
            <p id="azkar-text">ألا بذكر الله تطمئن القلوب</p>
            <button onclick="nextZekr()" class="btn-action">الذكر التالي</button>
        </div>
    </section>

    <section id="about-tab" class="tab-view">
        <div class="dev-card">
            <div class="avatar">J</div>
            <h2>عبدالرحمن الشديفات</h2>
            <p>مطور واجهات ويب</p>
            <div class="line"></div>
            <p class="bio">هذا التطبيق مقسم لواجهات منفصلة لتسهيل تجربة المستخدم.</p>
        </div>
    </section>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showTab(event, 'weather-tab')">
            <i class="fas fa-sun"></i>
            <span>الطقس</span>
        </button>
        <button class="nav-item" onclick="showTab(event, 'prayer-tab')">
            <i class="fas fa-mosque"></i>
            <span>الصلاة</span>
        </button>
        <button class="nav-item" onclick="showTab(event, 'azkar-tab')">
            <i class="fas fa-book-open"></i>
            <span>الأذكار</span>
        </button>
        <button class="nav-item" onclick="showTab(event, 'about-tab')">
            <i class="fas fa-user"></i>
            <span>عني</span>
        </button>
    </nav>
</div>

<script src="script.js"></script>
</body>
</html>
