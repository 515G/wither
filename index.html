<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Pro | بوصلة الطقس</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="app-container">
    <div class="search-box">
        <input id="city" type="text" placeholder="ابحث عن مدينة...">
        <button id="btn"><i class="fas fa-search"></i></button>
        <button id="location-btn" title="موقعي الحالي"><i class="fas fa-location-crosshairs"></i></button>
    </div>

    <div class="error" id="error"></div>

    <div class="weather-card" id="card">
        <h2 id="cityName"></h2>
        <p id="date"></p>
        <img id="weatherIcon" src="" alt="حالة الطقس">
        <div class="temp" id="temp"></div>
        <div class="desc" id="desc"></div>

        <div class="details">
            <div class="col">
                <i class="fas fa-droplet"></i>
                <div>
                    <p id="humidity"></p>
                    <span>الرطوبة</span>
                </div>
            </div>
            <div class="col">
                <i class="fas fa-wind"></i>
                <div>
                    <p id="wind"></p>
                    <span>الرياح</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
