<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>Weather ☁️</h1>
        <p class="designer">تصميم: J عبد الرحمن الشديفات</p>
    </div>

    <div class="search-area">
        <input type="text" id="city-input" placeholder="اكتب اسم المدينة..." autocomplete="off">
        <button id="search-btn">🔍</button>
    </div>
    
    <p id="msg-box" class="error-msg"></p>

    <div class="tabs-content">
        
        <div id="weather-tab" class="tab-view active">
            <div id="weather-info" style="display: none;">
                <h2 id="city-name"></h2>
                <h1 id="temp-display"></h1>
                <p id="weather-desc"></p>
                <div class="forecast" id="forecast-container"></div>
            </div>
            <div class="placeholder-msg">📍 ابحث عن مدينتك الآن</div>
        </div>

        <div id="prayer-tab" class="tab-view">
            <h3>🕋 مواقيت الصلاة</h3>
            <div id="prayer-times" class="prayer-grid">
                <p>قم بالبحث أولاً لتظهر المواقيت</p>
            </div>
        </div>

        <div id="azkar-tab" class="tab-view">
            <h3>📿 أذكار المسلم</h3>
            <div class="azkar-card">
                <p id="azkar-text">ألا بذكر الله تطمئن القلوب</p>
                <button onclick="nextZekr()" class="zekr-btn">الذكر التالي ➡️</button>
            </div>
        </div>

    </div> <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchView(event, 'weather-tab')">
            <span class="emoji">☁️</span>
            <span>الطقس</span>
        </button>
        <button class="nav-btn" onclick="switchView(event, 'prayer-tab')">
            <span class="emoji">🕋</span>
            <span>الصلاة</span>
        </button>
        <button class="nav-btn" onclick="switchView(event, 'azkar-tab')">
            <span class="emoji">📿</span>
            <span>الأذكار</span>
        </button>
    </nav>

</div> <script src="script.js"></script>
</body>
</html>
