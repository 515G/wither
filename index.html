<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-frame">
    <div id="view-weather" class="page-container active">
        <div class="search-wrapper">
            <input type="text" id="city-input" placeholder="اكتب اسم المدينة هنا...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
        <div class="display-area">
            <div id="weather-box" class="hidden">
                <h2 id="city-name"></h2>
                <div id="temp-val"></div>
                <p id="weather-desc"></p>
            </div>
            <p id="welcome-msg">🌟 ابحث عن مدينتك لعرض الطقس</p>
        </div>
    </div>

    <div id="view-prayer" class="page-container">
        <h2 class="title">🕋 مواقيت الصلاة</h2>
        <div id="prayer-output" class="prayer-box">
            <p style="opacity:0.6">بانتظار البحث عن مدينة...</p>
        </div>
    </div>

    <div id="view-azkar" class="page-container">
        <h2 class="title">📿 ذكر اليوم</h2>
        <div class="azkar-display">
            <p id="text-zekr">ألا بذكر الله تطمئن القلوب</p>
            <button onclick="newZekr()" class="btn-refresh">تغيير الذكر</button>
        </div>
    </div>

    <div id="view-dev" class="page-container">
        <div class="dev-card-premium">
            <div class="logo-j"></div>
            <h3>عبدالرحمن الشديفات J</h3>
            <span>Professional Web Developer</span>
            <div class="bar"></div>
            <p>تم تطوير هذا النظام بواجهات برمجية منفصلة لضمان أداء عالٍ واستقرار تام للمتصفح.</p>
        </div>
    </div>

    <nav class="footer-nav">
        <div class="nav-link active" onclick="go('view-weather', this)">
            <i class="fas fa-cloud-sun"></i>
            <span>الطقس</span>
        </div>
        <div class="nav-link" onclick="go('view-prayer', this)">
            <i class="fas fa-mosque"></i>
            <span>الصلاة</span>
        </div>
        <div class="nav-link" onclick="newZekr(); go('view-azkar', this)">
            <i class="fas fa-book-open"></i>
            <span>الأذكار</span>
        </div>
        <div class="nav-link" onclick="go('view-dev', this)">
            <i class="fas fa-code"></i>
            <span>المطور</span>
        </div>
    </nav>
</div>

<script src="script.js"></script>
</body>
</html>
