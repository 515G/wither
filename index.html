<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Pro | الرئيسية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="app-container">
    <nav class="nav-bar">
        <a href="index.html" class="nav-link active"><i class="fas fa-home"></i></a>
        <a href="tips.html" class="nav-link"><i class="fas fa-lightbulb"></i></a>
        <a href="about.html" class="nav-link"><i class="fas fa-info-circle"></i></a>
    </nav>

    <div class="search-box">
        <input id="city" type="text" placeholder="ابحث عن مدينة...">
        <button id="btn"><i class="fas fa-search"></i></button>
        <button id="location-btn"><i class="fas fa-location-arrow"></i></button>
    </div>

    <div class="error" id="error"></div>

    <div class="weather-card" id="card">
        <h2 id="cityName"></h2>
        <div id="date"></div>
        <img id="weatherIcon" src="" alt="">
        <div class="temp" id="temp"></div>
        <div class="desc" id="desc"></div>
        <div id="outfit-suggestion" class="suggestion-box"></div>
        <div class="details">
            <div class="col"><i class="fas fa-droplet"></i><span id="humidity"></span></div>
            <div class="col"><i class="fas fa-wind"></i><span id="wind"></span></div>
        </div>
        <div class="forecast-container" id="forecast"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
