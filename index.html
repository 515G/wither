<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Pro Max</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <nav class="nav-bar">
        <button onclick="showPage('home', this)" class="nav-link active"><i class="fas fa-home"></i></button>
        <button onclick="showPage('tips', this)" class="nav-link"><i class="fas fa-lightbulb"></i></button>
        <button onclick="showPage('about', this)" class="nav-link"><i class="fas fa-info-circle"></i></button>
    </nav>

    <div id="home" class="page active">
        <div class="search-box">
            <input id="city" type="text" placeholder="ابحث عن مدينة...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
            <button id="location-btn"><i class="fas fa-location-arrow"></i></button>
        </div>
        <div class="error" id="error"></div>
        <div class="weather-card" id="card" style="display: none;">
            <h2 id="cityName"></h2>
            <div id="date" style="opacity: 0.8; margin-bottom: 10px;"></div>
            <img id="weatherIcon" src="" alt="weather icon">
            <div class="temp" id="temp"></div>
            <div class="desc" id="desc"></div>
            <div id="suggestion" class="suggestion-box"></div>
            <div class="details">
                <div class="col"><i class="fas fa-droplet"></i> <span id="humidity"></span></div>
                <div class="col"><i class="fas fa-wind"></i> <span id="wind"></span></div>
            </div>
            <div class="forecast-container" id="forecast"></div>
        </div>
    </div>

    <div id="tips" class="page">
        <h3 style="margin-bottom: 20px;">نصائح ذكية</h3>
        <div class="tips-list">
            <div class="tip-item">🧥 الجو بارد؟ لا تنسَ معطفك المفضل.</div>
            <div class="tip-item">☀️ الشمس قوية اليوم، واقي الشمس خيار ذكي.</div>
            <div class="tip-item">💧 الرطوبة عالية، اشرب الكثير من الماء.</div>
            <div class="tip-item">🚲 الرياح هادئة، وقت مثالي للرياضة!</div>
        </div>
    </div>

    <div id="about" class="page">
        <h3 style="margin-bottom: 15px;">حول التطبيق</h3>
        <p>تطبيق طقس متكامل يعتمد على بيانات حقيقية من OpenWeatherMap.</p>
        <div style="margin-top: 30px; font-size: 30px; display: flex; justify-content: center; gap: 20px;">
            <i class="fab fa-github"></i>
            <i class="fab fa-linkedin"></i>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
