<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather | عبدالرحمن الشديفات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-card">
    
    <div class="search-section">
        <div class="search-bar">
            <input type="text" id="city-input" placeholder="اكتب اسم المدينة..." autocomplete="off">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
        <p id="msg-box" class="error-msg"></p>
    </div>

    <div class="content-box">
        <div id="weather-info">
            <h2 id="city-name">الطقس الآن</h2>
            <h1 id="temp-display">--°</h1>
            <p id="weather-desc">أدخل المدينة للبدء</p>
            <div class="forecast" id="forecast-container"></div>
        </div>
    </div>

    <div class="content-box">
        <h3><i class="fas fa-mosque"></i> مواقيت الصلاة</h3>
        <div id="prayer-times" class="prayer-grid">
            <p style="grid-column: span 3; opacity: 0.6;">بانتظار تحديد المدينة</p>
        </div>
    </div>

    <div class="content-box azkar-box">
        <p id="azkar-text">ألا بذكر الله تطمئن القلوب</p>
        <button onclick="nextZekr()" class="zekr-btn">ذكر آخر</button>
    </div>

    <div class="footer">
        بواسطة: عبدالرحمن الشديفات
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
