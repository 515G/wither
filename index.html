<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather | عبدالرحمن الشديفات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="web-app">
        <section id="weather-view" class="view active">
            <div class="search-section">
                <input type="text" id="city-input" placeholder="أدخل اسم المدينة...">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <div id="weather-display" class="view-content">
                <div id="weather-data" style="display: none;">
                    <h2 id="city-name"></h2>
                    <h1 id="temp-val"></h1>
                    <p id="condition"></p>
                    <div id="forecast" class="forecast-grid"></div>
                </div>
                <div class="empty-state">
                    <i class="fas fa-cloud-sun-rain"></i>
                    <p>أهلاً بك! ابحث عن مدينة لمعرفة حالة الجو</p>
                </div>
            </div>
        </section>

        <section id="prayer-view" class="view">
            <header class="view-header">
                <h3><i class="fas fa-mosque"></i> مواقيت الصلاة</h3>
            </header>
            <div class="view-content">
                <div id="prayer-list" class="prayer-container">
                    <p class="hint">يرجى تحديد المدينة من قسم الطقس أولاً</p>
                </div>
            </div>
        </section>

        <section id="azkar-view" class="view">
            <header class="view-header">
                <h3><i class="fas fa-book-open"></i> أذكار المسلم</h3>
            </header>
            <div class="view-content">
                <div class="zekr-card">
                    <p id="zekr-text">ألا بذكر الله تطمئن القلوب</p>
                    <button onclick="changeZekr()" class="main-btn">الذكر التالي</button>
                </div>
            </div>
        </section>

        <section id="about-view" class="view">
            <div class="view-content dev-profile">
                <div class="profile-card">
                    <div class="avatar">J</div>
                    <h2>عبدالرحمن الشديفات</h2>
                    <p class="title">مطور واجهات ويب</p>
                    <div class="divider"></div>
                    <p class="desc">تم تصميم وتطوير هذا الموقع لتقديم خدمات الطقس ومواقيت الصلاة بطريقة عصرية وسهلة.</p>
                </div>
            </div>
        </section>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchView('weather-view', this)">
                <i class="fas fa-cloud"></i>
                <span>الطقس</span>
            </div>
            <div class="nav-item" onclick="switchView('prayer-view', this)">
                <i class="fas fa-clock"></i>
                <span>الصلاة</span>
            </div>
            <div class="nav-item" onclick="switchView('azkar-view', this)">
                <i class="fas fa-heart"></i>
                <span>الأذكار</span>
            </div>
            <div class="nav-item" onclick="switchView('about-view', this)">
                <i class="fas fa-user-circle"></i>
                <span>عني</span>
            </div>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
