<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-card">
    <div class="search-area">
        <input type="text" id="city-input" placeholder="ابحث عن مدينة..." autocomplete="off">
        <button id="search-btn"><i class="fas fa-search"></i></button>
        <button id="geo-btn"><i class="fas fa-location-arrow"></i></button>
    </div>

    <p id="msg-box" class="message"></p>

    <nav class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'weather-tab')"><i class="fas fa-sun"></i></button>
        <button class="tab-btn" onclick="openTab(event, 'prayer-tab')"><i class="fas fa-mosque"></i></button>
        <button class="tab-btn" onclick="openTab(event, 'azkar-tab')"><i class="fas fa-book-open"></i></button>
        <button class="tab-btn" onclick="openTab(event, 'about-tab')"><i class="fas fa-info-circle"></i></button>
    </nav>

    <div id="weather-tab" class="tab-content active">
        <div id="weather-info" style="display: none;">
            <h2 id="city-name"></h2>
            <img id="main-icon" src="" alt="">
            <h1 id="temp-display"></h1>
            <p id="weather-desc"></p>
            <div class="suggestion" id="outfit-msg"></div>
            <div class="forecast" id="forecast-container"></div>
        </div>
    </div>

    <div id="prayer-tab" class="tab-content">
        <h3>مواقيت الصلاة</h3>
        <div id="prayer-times" class="prayer-grid">
            <p style="margin-top:20px; opacity:0.7">يرجى البحث عن مدينة لعرض المواقيت</p>
        </div>
    </div>

    <div id="azkar-tab" class="tab-content">
        <h3>أذكار المسلم</h3>
        <div class="azkar-box">
            <p id="azkar-text">ألا بذكر الله تطمئن القلوب</p>
            <button onclick="nextZekr()" class="next-btn">الذكر التالي</button>
        </div>
    </div>

    <div id="about-tab" class="tab-content">
        <p style="margin-top:20px;">تم التطوير بواسطة:<br><b>J عبدالرحمن الشديفات</b></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
