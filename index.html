<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f78cf">
<title>نَسيم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-sky="clear">
<canvas id="fx"></canvas>
<div class="mini" id="mini"><span id="miniCity"></span><b id="miniTemp"></b><span id="miniCond"></span></div>

<main>
<section id="weather">
  <div class="hero" id="hero">
    <label class="pill">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <select id="city" aria-label="المدينة"></select>
    </label>
    <div class="temp"><span id="temp">--</span><sup>°</sup></div>
    <p class="cond" id="cond">جارٍ التحميل</p>
    <p class="hl" id="hl"></p>
  </div>

  <div class="banner" id="banner"><p id="bt"></p><small id="bs"></small></div>

  <div class="card"><h2>الساعات القادمة</h2><div class="hours" id="hours"></div></div>
  <div class="card"><h2>الأسبوع</h2><ul class="days" id="days"></ul></div>
  <div class="card"><h2>الشمس</h2><div id="sun"></div></div>
  <div class="tiles" id="tiles"></div>
</section>

<section id="prayer" class="card">
  <h2>مواقيت الصلاة</h2>
  <div class="pr"><div id="prRing"></div><div class="c"><span id="nextName">--</span><b id="countdown">--:--:--</b></div></div>
  <ul class="times" id="times"></ul>
</section>

<section id="azkar" class="card">
  <div class="ah"><h2>الأذكار</h2>
    <div class="seg"><button data-set="morning" aria-selected="true">الصباح</button><button data-set="evening" aria-selected="false">المساء</button></div>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <p class="bl" id="barLabel"></p>
  <ul class="zikr" id="zikr"></ul>
</section>

<footer>نَسيم · Open-Meteo · Aladhan</footer>
</main>

<nav class="dock">
  <a href="#weather" class="on"><svg viewBox="0 0 24 24"><path d="M7 18h10.5a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7.3 8.6 4.7 4.7 0 0 0 7 18z"/></svg>الطقس</a>
  <a href="#prayer"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>الصلاة</a>
  <a href="#azkar"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>الأذكار</a>
</nav>
<script src="app.js"></script>
</body>
</html>
