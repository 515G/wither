<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather | عبدالرحمن الشديفات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-container">
    <div class="header-section">
        <h1 class="app-logo">Weather</h1>
        <div class="search-bar">
            <input type="text" id="city-input" placeholder="اكتب اسم المدينة هنا..." autocomplete="off">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
        <p id="msg-box" class="error-msg"></p>
    </div>

    <section class="card weather-card">
        <div class="weather-main">
            <h2 id="city-name">ابحث عن مدينتك</h2>
            <h1 id="temp-display">--°</h1>
            <p id="weather-desc">اكتشف حالة الجو وتوقعات الأيام</p>
        </div>
        <div class="forecast-strip" id="forecast-container"></div>
    </section>

    <section class="card islamic-card">
        <div class="prayer-header">
            <h3><i class="fas fa-mosque"></i> مواقيت الصلاة</h3>
            <span id="prayer-city-label"></span>
        </div>
        <div id="prayer-times" class="prayer-list">
            <p class="placeholder">تظهر المواقيت عند البحث</p>
        </div>
        <div class="zekr-box">
            <p id="azkar-text">ألا بذكر الله تطمئن القلوب</p>
            <button onclick="nextZekr()" class="btn-zekr">ذكر آخر</button>
        </div>
    </section>

    <footer class="footer">
        <p>تم التطوير بواسطة <b>عبدالرحمن الشديفات</b></p>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
