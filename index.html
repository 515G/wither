<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather | عبدالرحمن الشديفات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-card">
    <div class="search-area">
        <input type="text" id="city-input" placeholder="اكتب اسم المدينة..." autocomplete="off">
        <button id="search-btn"><i class="fas fa-search"></i></button>
    </div>
    
    <p id="msg-box" class="msg"></p>

    <div id="weather-info" class="section">
        <h2 id="city-name">الطقس</h2>
        <h1 id="temp-display">--°</h1>
        <p id="weather-desc">أدخل المدينة لمعرفة الجو</p>
        <div class="forecast" id="forecast-container"></div>
    </div>

    <div class="section">
        <h3><i class="fas fa-mosque"></i> مواقيت الصلاة</h3>
        <div id="prayer-times" class="prayer-grid">
            <p>بانتظار البحث...</p>
        </div>
    </div>

    <div class="section azkar-section">
        <p id="azkar-text">ألا بذكر الله تطمئن القلوب</p>
        <button onclick="nextZekr()" class="btn-zekr">ذكر آخر</button>
    </div>

    <div class="footer">تطوير: عبدالرحمن الشديفات</div>
</div>

<script src="script.js"></script>
</body>
</html>
