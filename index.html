<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header class="main-header">
        <h1>Weather ☁️</h1>
    </header>

    <section class="search-card">
        <div class="search-box">
            <input type="text" id="city-input" placeholder="ابحث عن مدينتك..." autocomplete="off">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
        <p id="msg-box" class="error-msg"></p>
    </section>

    <section id="weather-section" class="app-section">
        <div id="weather-info" style="display: none;">
            <h2 id="city-name">--</h2>
            <h1 id="temp-display">--°</h1>
            <p id="weather-desc">--</p>
            <div class="forecast" id="forecast-container"></div>
        </div>
        <div id="weather-placeholder">أدخل المدينة لعرض الطقس</div>
    </section>

    <section class="app-section">
        <h3><i class="fas fa-mosque"></i> مواقيت الصلاة</h3>
        <div id="prayer-times" class="prayer-grid">
            <p>بانتظار البحث...</p>
        </div>
    </section>

    <section class="app-section azkar-card">
        <h3><i class="fas fa-book-open"></i> أذكار المسلم</h3>
        <p id="azkar-text">ألا بذكر الله تطمئن القلوب</p>
        <button onclick="nextZekr()" class="btn-next">الذكر التالي</button>
    </section>

    <footer class="dev-section">
        <div class="dev-badge">
            <p>تم التطوير بواسطة</p>
            <h2>عبدالرحمن الشديفات J<span class="j-mark">J</span></h2>
        </div>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
