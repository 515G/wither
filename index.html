<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <nav class="nav-bar">
        <button onclick="changeTab('home', this)" class="nav-btn active"><i class="fas fa-cloud-sun"></i></button>
        <button onclick="changeTab('tips', this)" class="nav-btn"><i class="fas fa-lightbulb"></i></button>
        <button onclick="changeTab('about', this)" class="nav-btn"><i class="fas fa-info-circle"></i></button>
    </nav>

    <div id="home" class="content-section active">
        <div class="search-box">
            <input id="city-input" type="text" placeholder="اكتب اسم المدينة...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
            <button id="loc-btn"><i class="fas fa-location-arrow"></i></button>
        </div>
        
        <div id="error-msg" class="error"></div>

        <div id="weather-display" style="display: none;">
            <h2 id="cityName"></h2>
            <img id="weatherIcon" src="" alt="">
            <div class="temp" id="temp-val"></div>
            <div id="weather-desc"></div>
            <div id="suggestion-msg" class="suggestion-box"></div>
            
            <div class="forecast-container" id="forecast-box"></div>
        </div>
    </div>

    <div id="tips" class="content-section">
        <h3>نصائح الطقس</h3>
        <div class="tip-item">🧥 الجو بارد؟ ارتدِ ملابس ثقيلة.</div>
        <div class="tip-item">☀️ الشمس قوية؟ لا تنسَ واقي الشمس.</div>
        <div class="tip-item">💧 اشرب الكثير من الماء دائماً.</div>
    </div>

    <div id="about" class="content-section">
        <h3>حول التطبيق</h3>
        <p>تطبيق طقس احترافي يعتمد على بيانات دقيقة وتصميم تفاعلي.</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
